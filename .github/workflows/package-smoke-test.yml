name: Package smoke test

# Build the wheel, install it into a clean Python on each OS, and run
# tests/smoke_test.py against the installed `jardesigner` command.

on:
  push:
    branches: [main, development, feature/pip-packaging]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-14 is Apple silicon. Intel macOS is not listed because
        # pymoose publishes no x86_64 macOS wheels.
        os: [ubuntu-latest, macos-14, windows-latest]
        python: ['3.10', '3.12', '3.13']
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Build wheel
        run: python -m pip wheel . --no-deps -w dist

      - name: Install wheel
        shell: bash
        run: python -m pip install dist/jardesigner-*.whl "python-socketio[client]" websocket-client

      - name: Check MOOSE loads
        run: python -c "import moose; print('moose', moose.__version__)"

      - name: Smoke test
        env:
          PYTHONUNBUFFERED: '1'
        run: python tests/smoke_test.py
