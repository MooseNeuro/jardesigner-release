[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jardesigner"
version = "1.2"
description = "JARDesigner -- browser-based GUI for building and simulating multiscale neuronal models with MOOSE."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "Flask",
    "flask-cors",
    "Flask-SocketIO",
    "jsonschema",
    "lxml",
    "matplotlib",
    "pymoose",
    "numpy",
    "requests",
    "Werkzeug",
    "gevent",
    "gevent-websocket",
    "urllib3",
    "platformdirs",
]

[project.scripts]
jardesigner = "jardesigner._app:main"

[tool.hatch.build.targets.wheel]
packages = ["jardesigner"]
