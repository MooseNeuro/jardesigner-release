[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jardesigner"
version = "1.3.1"
description = "JARDesigner -- browser-based GUI for building and simulating multiscale neuronal models with MOOSE."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "GPL-3.0-or-later" }

dependencies = [
    "Flask",
    "flask-cors",
    "Flask-SocketIO",
    "jsonschema",
    "lxml",
    "matplotlib",
    "pymoose",
    "numpy",
    "requests",
    "Werkzeug",
    "gevent",
    "gevent-websocket",
    "httpx",
    "urllib3",
    "platformdirs",
    # Reaction-graph layout. Its wheels bundle Graphviz, so no system install
    # is needed; there are no wheels for 3.9, where a system dot is used.
    "pygraphviz; python_version >= '3.10'",
]

[project.scripts]
jardesigner = "jardesigner._app:main"

[tool.hatch.build.targets.wheel]
packages = ["jardesigner"]

[tool.hatch.build.targets.sdist]
# Hatchling reads only the root .gitignore, so without this list the sdist
# picked up frontend/node_modules (54k files, platform-specific binaries)
# and the duplicate backend/ tree. The package, including the prebuilt UI
# in jardesigner/static, is all that is needed to build the wheel.
include = [
    "/jardesigner",
    "/tests",
    "/README.md",
    "/LICENSE",
]
